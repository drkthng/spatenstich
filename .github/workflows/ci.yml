name: CI — Checks

# Runs for pull requests, and is called by the deploy workflow before every deploy
# (work goes straight to master, so the deploy is the gate).
on:
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # AI-01: no server secret in the repository. The self-test plants made-up keys and
      # expects the scan to fail on them, so a scan that passes means something.
      - name: Secret scan — self-test with planted keys
        run: node scripts/check-secrets.test.mjs
      - name: Secret scan — repository
        run: node scripts/check-secrets.mjs repo

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Lint
        run: pnpm -r run lint
      - name: Test
        run: pnpm -r run test --passWithNoTests

      # The AI edge function: type-check against the real SDK, then its tests.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge function — type-check
        run: deno check supabase/functions/ai/index.ts
      - name: Edge function — tests
        run: deno test supabase/functions/ai/

      - name: Web export (for bundle scan)
        run: pnpm --filter app exec expo export --platform web
      - name: Secret scan — bundle
        run: |
          bash scripts/check-claude-key-in-bundle.sh app/dist
          node scripts/check-secrets.mjs dir app/dist
