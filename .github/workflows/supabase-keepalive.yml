name: Supabase Keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (plants table, limit 1)
        run: |
          if [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::EXPO_PUBLIC_SUPABASE_URL oder EXPO_PUBLIC_SUPABASE_ANON_KEY ist leer — Secret fehlt, Keep-alive kann nicht laufen." >&2
            exit 1
          fi
          curl -sf "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}/rest/v1/plants?select=slug&limit=1" \
            -H "apikey: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}"
